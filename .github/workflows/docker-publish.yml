name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ] # Trigger every time you push to the main branch! 

jobs:
  build-and-push:
    runs-on: ubuntu-latest # GitHub spins up a fresh Linux VM for us! 

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v4
        with:
          context: . # Use the current folder as build context
          push: true # Push it to Docker Hub!
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/wol-proxy:latest
